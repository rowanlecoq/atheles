  <g>
    <path class="marble-line" d="M50 220 C380 120, 640 280, 980 200 C1320 120, 1620 290, 2150 170" />
    <path class="marble-line" d="M-30 430 C250 360, 560 470, 830 405 C1120 330, 1400 460, 2230 340" />
    <path class="marble-line" d="M20 650 C320 570, 610 710, 900 640 C1200 570, 1570 730, 2180 620" />
    <path class="marble-line" d="M-50 880 C290 800, 560 940, 910 870 C1240 800, 1520 950, 2200 840" />
    <path class="marble-line" d="M40 1120 C280 1060, 620 1180, 920 1120 C1240 1050, 1590 1210, 2170 1100" />
    <path class="marble-line" d="M-20 1370 C300 1280, 570 1450, 940 1360 C1270 1280, 1550 1470, 2240 1340" />
    <path class="marble-line" d="M90 1630 C330 1540, 620 1700, 930 1625 C1270 1545, 1510 1720, 2160 1600" />
    <path class="marble-line" d="M0 1880 C300 1810, 600 1960, 910 1885 C1260 1795, 1540 1980, 2230 1860" />
    <path class="marble-line" d="M120 60 C310 170, 500 150, 720 60" />
    <path class="marble-line" d="M1510 140 C1680 250, 1900 230, 2120 120" />
    <path class="marble-line" d="M100 2050 C330 1960, 520 1990, 770 2090" />
    <path class="marble-line" d="M1470 2030 C1690 1940, 1880 2000, 2130 2100" />
  </g>
</svg>