<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 2200 2200">
  <defs>
    <style>
      @keyframes trace-col {
        from { stroke-dashoffset: 600; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes trace-leaf {
        from { stroke-dashoffset: 300; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes trace-wreath {
        from { stroke-dashoffset: 900; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes trace-marble {
        from { stroke-dashoffset: 3000; }
        to   { stroke-dashoffset: 0; }
      }

      .column-line {
        fill: none;
        stroke: #ccb173;
        stroke-opacity: 0.042;
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: trace-col 10s cubic-bezier(0.25,0.1,0.25,1) 0.5s forwards;
      }

      .leaf-line {
        fill: none;
        stroke: #ccb173;
        stroke-opacity: 0.032;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: trace-leaf 8s cubic-bezier(0.25,0.1,0.25,1) 1s forwards;
      }

      .wreath-line {
        fill: none;
        stroke: #ccb173;
        stroke-opacity: 0.03;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: trace-wreath 12s cubic-bezier(0.25,0.1,0.25,1) 0.8s forwards;
      }

      .marble-line {
        fill: none;
        stroke: #ccb173;
        stroke-opacity: 0.017;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
        animation: trace-marble 10s cubic-bezier(0.25,0.1,0.25,1) 1.5s forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .column-line, .leaf-line, .wreath-line, .marble-line {
          stroke-dasharray: none;
          stroke-dashoffset: 0;
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Column motif (from Wikimedia Greek_temple.svg) -->
  <g id="column-motif">
    <path class="column-line" d="m 29.17581,372.36671 49.826505,0 c 0,0 3.977527,124.14952 3.772002,155.15954 -0.30474,45.97965 0.514638,128.4226 0.514638,128.4226 l -59.611987,0 c 0,0 -0.599043,-82.85774 0.530318,-127.68529 0.775817,-30.79435 4.968524,-155.89685 4.968524,-155.89685 z" />
    <rect class="column-line" x="6.2168694" y="334.89636" width="94.373444" height="22.100552" />
    <path class="column-line" d="m 6.9137804,357.13485 92.8327246,0 -20.763454,15.29412 -49.653674,0 z" />
  </g>

  <!-- Olive branch motif (from Wikimedia Olive_branch.svg) -->
  <g id="olive-motif">
    <path class="leaf-line" d="M 125,21 C 133.332,17.4017 138.004,10.8076 140,2 C 131.768,4.80043 126.623,12.7823 125,21 M 121,9 C 115.423,14.8743 109.344,21.3927 111,30 C 116.736,25.9224 123.654,16.4819 121,9 M 105,17 C 99.4877,23.3758 96.0764,29.4521 96,38 C 102.695,34.4163 108.138,24.5495 105,17 M 91,22 C 86.9367,28.7251 80.7286,35.7187 83,44 C 89.5693,39.9945 94.1158,29.4955 91,22 z" />
    <path class="leaf-line" d="M 123,22 C 111.924,33.0683 94.8436,47.1444 78,46 C 73.0981,49.7183 64.0415,49.1726 58,50 C 37.7062,52.7794 14.2794,52.3969 4,74 C 12.8131,73.2993 18.6752,60.2677 28,57.3897 C 53.2896,49.5842 80.3415,54.3855 104,40.1998 C 109.807,36.718 123.162,29.6358 123,22 z" />
    <path class="leaf-line" d="M 120,32 C 128.488,31.8239 135.85,28.9759 141,22 C 132.506,22.1753 124.21,23.9759 120,32 M 110,41 C 117.984,43.968 124.524,41.0661 132,38 C 125.775,33.747 114.666,35.2613 110,41 M 93,46 C 95.8923,54.6746 110.783,52.29 118,52 L 115,46 L 93,46 z" />
  </g>

  <!-- Laurel stems (from Wikimedia Greek_Roman_Laurel_wreath_with_branches_vector.svg) -->
  <g transform="translate(645 780) scale(1.14)">
    <path class="wreath-line" d="m 312.5,623.5 c -30.6,0 -30.6,0 -30.6,0 0,0 -84.59735,21.37145 -163.9,-81.5 C 38.697351,439.12855 58.6,371.3 58.6,371.3 c 0,0 24.076423,-99.42604 102.7,-143.5 78.62358,-44.07397 50.76148,-28.59502 50.76148,-28.59502" />
    <path class="wreath-line" d="m 281.9,623.5 c 30.6,0 30.6,0 30.6,0 0,0 84.59735,21.37145 163.9,-81.5 79.30265,-102.87145 59.4,-170.7 59.4,-170.7 0,0 -24.07642,-99.42603 -102.7,-143.49999 -78.62358,-44.07398 -50.76148,-28.59503 -50.76148,-28.59503" />
  </g>

  <!-- More columns for denser Greek structure -->
  <use href="#column-motif" transform="translate(120 360) scale(1.25)" />
  <use href="#column-motif" transform="translate(2060 360) scale(-1.25 1.25)" />
  <use href="#column-motif" transform="translate(410 520) scale(0.9)" />
  <use href="#column-motif" transform="translate(1790 520) scale(-0.9 0.9)" />
  <use href="#column-motif" transform="translate(220 1130) scale(1.06)" />
  <use href="#column-motif" transform="translate(1980 1130) scale(-1.06 1.06)" />
  <use href="#column-motif" transform="translate(740 1480) scale(0.72)" />
  <use href="#column-motif" transform="translate(1470 1480) scale(-0.72 0.72)" />

  <!-- Denser leaf distribution -->
  <use href="#olive-motif" transform="translate(120 110) scale(4.8)" />
  <use href="#olive-motif" transform="translate(2080 110) scale(-4.8 4.8)" />
  <use href="#olive-motif" transform="translate(95 840) scale(4.2)" />
  <use href="#olive-motif" transform="translate(2105 840) scale(-4.2 4.2)" />
  <use href="#olive-motif" transform="translate(410 1630) scale(3.8)" />
  <use href="#olive-motif" transform="translate(1790 1630) scale(-3.8 3.8)" />

